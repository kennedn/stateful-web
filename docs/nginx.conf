# Merge these locations into your existing HTTPS server block.
# Keep your existing public/internal authentication policy in place.
# A public, unauthenticated proxy from your LAN could bypass API authentication.
# Set params.apiBaseURL = '' in hugo.toml and rebuild first.

root /srv/stateful-web-static/public;
index index.html;

location / {
    try_files $uri $uri/ =404;
}

location = /v2 {
    proxy_pass https://api.kennedn.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api.kennedn.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host api.kennedn.com;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location ^~ /v2/ {
    proxy_pass https://api.kennedn.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api.kennedn.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host api.kennedn.com;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}
